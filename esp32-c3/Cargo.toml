[workspace]
resolver = "2"
members = ["./crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v0.0.38" }
dux-sht4x = { path = "../driver/crates/dux-sht4x/" }
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v0.0.38" }
pain = { path = "./crates/pain" }

defmt = "1.0.1"
embedded-hal-bus = "0.3.0"
esp-alloc = { version = "0.10.0", features = ["defmt"] }
esp-backtrace = {
  version = "0.19.0",
  features = [
    "defmt",
    "esp32c3",
    "panic-handler",
  ]
}
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-hal = {
  version = "1.0.0-rc.0",
  features = [
    "defmt",
    "esp32c3",
    "unstable",
  ]
}
esp-hal-smartled = { version = "0.17.0", features = ["esp32c3"] }
esp-println = { version = "0.17.0", features = ["defmt-espflash", "esp32c3"] }
heapless = "0.9.1"
i2c-character-display = { version = "0.5" }
micromath = "2.1.0"
panic-halt = "1.0.0"
riscv = "0.16.0"
smart-leds = "0.4"

[profile.dev]
opt-level = 3
overflow-checks = true
lto = "fat"

[profile.release]
opt-level = 3
debug = false
overflow-checks = false
lto = "fat"
panic = "abort"
codegen-units = 1
