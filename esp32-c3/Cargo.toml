[workspace]
resolver = "3"
members = ["./crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v0.0.38" }
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v0.0.38" }
pain = { path = "./crates/pain" }

defmt = "1.1.1"
embedded-hal-bus = "0.3.0"
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32c3"] }
esp-backtrace = {
  version = "0.20.0",
  features = [
    "defmt",
    "esp32c3",
    "panic-handler",
  ]
}
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-hal = {
  version = "1.2.1",
  features = [
    "defmt",
    "esp32c3",
    "unstable",
  ]
}
esp-hal-smartled = { version = "0.18.0", features = ["esp32c3"] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32c3"] }
heapless = "0.9.3"
i2c-character-display = { version = "0.5.2" }
micromath = "2.1.0"
panic-halt = "1.0.0"
riscv = "0.16.1"
smart-leds = "0.4"

[profile.dev]
opt-level = 3
overflow-checks = true
lto = "fat"

[profile.release]
opt-level = 3
debug = false
overflow-checks = false
lto = "fat"
panic = "abort"
codegen-units = 1
