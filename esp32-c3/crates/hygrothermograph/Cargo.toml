[package]
edition.workspace = true
name = "hygrothermograph"
version = "0.1.0"

[dependencies]
esp-backtrace = { workspace = true, features = [
  "esp32c3",
  "panic-handler",
  "exception-handler",
  "println",
] }
esp-bootloader-esp-idf = { workspace = true }
esp-hal = { workspace = true, features = ["esp32c3", "unstable"] }
esp-hal-smartled = { workspace = true, features = ["esp32c3"] }
esp-println = { workspace = true, features = ["esp32c3"] }
micromath = { workspace = true }
smart-leds = { workspace = true }
i2c-character-display = { workspace = true }
embedded-hal = { workspace = true }
sht4x = { workspace = true }
embedded-hal-bus = { workspace = true }
heapless= { workspace = true }