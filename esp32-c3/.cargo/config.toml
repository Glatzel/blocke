[build]
rustflags = ["-C", "link-arg=-Tlinkall.x", "-C", "link-arg=-Tdefmt.x"]
target = "riscv32imc-unknown-none-elf"

[unstable]
build-std = ["core", "alloc"]

[target.'cfg(debug_assertions)']
rustflags = [
    "-C",
    "link-arg=-Tlinkall.x",
    "-C",
    "link-arg=-Tdefmt.x",
    "-C",
    "force-frame-pointers",
]

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c3 --log-format defmt"

[env]
DEFMT_LOG = "info"
