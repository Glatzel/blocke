name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    paths-ignore:
      - "*.md"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push'}}

jobs:
  lefthook:
    uses: ./.github/workflows/ci-lefthook.yml
  changed:
    outputs:
      changed-driver: ${{ steps.main.outputs.driver_any_changed }}
      changed-esp32-c3: ${{ steps.main.outputs.esp32-c3_any_changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: ${{github.event_name == 'pull_request'}}
      - id: main
        uses: tj-actions/changed-files@v47
        if: ${{github.event_name == 'pull_request'}}
        with:
          files_yaml: |
            driver:
              - ./driver/**
              - ./.github/**
            esp32-c3:
              - ./esp32-c3/**
              - ./.github/**

  build-esp32-c3:
    needs: changed
    strategy:
      fail-fast: false
      matrix:
        args:
          - ""
          - "--release"
    if: ${{ needs.changed.outputs.changed-esp32-c3 != 'false' }}
    uses: ./.github/workflows/rust.yml
    with:
      working-directory: "./esp32-c3"
      build: true
      build-args: ${{matrix.args}}
      build-machine: '["ubuntu-slim"]'
  build-driver:
    needs: changed
    strategy:
      fail-fast: false
      matrix:
        args:
          - "--workspace"
          - "--workspace --features async"
    if: ${{ needs.changed.outputs.changed-esp32-c3 != 'false' }}
    uses: ./.github/workflows/rust.yml
    with:
      working-directory: "./driver"
      build: true
      build-args: ${{matrix.args}}
      build-machine: '["ubuntu-slim"]'
  test-driver:
    needs: changed
    uses: ./.github/workflows/rust.yml
    with:
      working-directory: "./driver"
      test: true
      test-args: --features async
      build-machine: '["ubuntu-slim"]'
  check-point:
    if: ( cancelled() || failure() ) && github.event_name == 'pull_request'
    needs: [lefthook, build-driver, build-esp32-c3, changed, test-driver]
    runs-on: ubuntu-slim
    steps:
      - run: exit 1
