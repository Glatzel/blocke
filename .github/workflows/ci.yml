name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    paths-ignore:
      - "*.md"
  schedule:
    - cron: 0 16 * * *

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32-c3]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{matrix.chip}}
    steps:
      - uses: actions/checkout@v5
      - run: cargo build
      - run: cargo build --release

  build-driver:
    strategy:
      fail-fast: false
      matrix:
        args:
          - --workspace
          - --workspace --features async
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./driver
    steps:
      - uses: actions/checkout@v5
      - run: cargo build ${{matrix.args}}

  test-driver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./driver
    steps:
      - uses: actions/checkout@v5
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - run: ./scripts/cargo-test.ps1 --no-default-features  --workspace
        shell: pwsh
      - name: Upload results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          fail_ci_if_error: true
