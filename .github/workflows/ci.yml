name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    paths-ignore:
      - "*.md"
  schedule:
    - cron: 0 16 * * *

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    outputs:
      changed-driver: ${{ steps.main.outputs.driver_any_changed }}
      changed-esp32-c3: ${{ steps.main.outputs.esp32-c3_any_changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: ${{github.event_name == 'pull_request'}}
      - id: main
        uses: tj-actions/changed-files@v47
        if: ${{github.event_name == 'pull_request'}}
        with:
          files_yaml: |
            driver:
              - ./driver/**
              - ./.github/**
            esp32-c3:
              - ./esp32-c3/**
              - ./.github/**

  build-esp32-c3:
    needs: changed
    if: ${{ needs.changed.outputs.changed-esp32-c3 != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./esp32-c3
    steps:
      - uses: actions/checkout@v5
      - run: cargo build
      - run: cargo build --release

  build-driver:
    needs: changed
    if: ${{ needs.changed.outputs.changed-driver != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        args:
          - --workspace
          - --workspace --features async
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./driver
    steps:
      - uses: actions/checkout@v5
      - run: cargo build ${{matrix.args}}

  test-driver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./driver
    steps:
      - uses: actions/checkout@v5
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          run-install: false
      - run: ./scripts/cargo-test.ps1 --features async
        shell: pwsh
      - name: Upload results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          fail_ci_if_error: true
