name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.3)'
        type: string
        required:  true


concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  rattler-build:
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-latest, ubuntu-latest, macos-latest,ubuntu-24.04-arm]
    runs-on: ${{matrix.machine}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.12
        with:
          run-install: false
      - name: build
        run: ./rattler/ci-blocke.ps1
        shell: pwsh

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: blocke-${{matrix.machine}}
          path: |
            ./rattler/output/*/*.conda
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: [rattler-build]
    uses: Glatzel/template/.github/workflows/release.yml@main
    with:
      override: true
      tag: ${{inputs.tag}}
      have-changelog: true
      assets: true
