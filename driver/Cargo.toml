[workspace]
members = ["./crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
fixed = "1.29.0"
paste = "1.0.15"
sensirion-i2c = "0.4.0"
thiserror = { version = "2.0.17", default-features = false }

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
strip = true
